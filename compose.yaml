name: hcm-km-phase0

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: hcm_km_root
      MARIADB_DATABASE: hcm_km_dev
      MARIADB_USER: hcm_km
      MARIADB_PASSWORD: hcm_km_dev
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - hcm_km_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Local stand-in for a company MinIO / S3 bucket (image storage). Started by
  # `make storage-up`, not by `make db-up`. Console: http://127.0.0.1:9001
  # The community fork: MinIO Inc. withdrew `minio/minio` from Docker Hub and
  # Quay in September 2026. Same server command, variables and S3 API.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: hcm_km_minio
      MINIO_ROOT_PASSWORD: hcm_km_minio_dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - hcm_km_minio_data:/data

volumes:
  hcm_km_mariadb_data:
  hcm_km_minio_data:
