name: Phase 2 Dev Gate

on:
  push:
    branches:
      - phase-2-implementation

permissions:
  contents: read

concurrency:
  group: phase2-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint
