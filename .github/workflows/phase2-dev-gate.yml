name: Phase 2 Dev Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase2-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build without network access
        run: npm run build:offline

  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: hcm_km_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -phcm_km_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      KM_E2E_BUILD_CACHE: "true"
      KM_TEST_DB_HOST: 127.0.0.1
      KM_TEST_DB_PORT: 3307
      KM_TEST_DB_USER: root
      KM_TEST_DB_PASSWORD: hcm_km_root
      KM_TEST_DB_ADMIN_USER: root
      KM_TEST_DB_ADMIN_PASSWORD: hcm_km_root
      KM_TEST_ADMIN_DATABASE: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore application compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .cache/e2e-sso
          key: e2e-next-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs', 'tailwind.config.ts', 'patches/**') }}-${{ hashFiles('src/**', 'tests/e2e/fixtures/phase3-*.ts') }}
          restore-keys: |
            e2e-next-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs', 'tailwind.config.ts', 'patches/**') }}-
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --reporter=list,blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/e2e-runs/
            blob-report/
          retention-days: 7

  e2e:
    name: e2e
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-test-results-*
          path: e2e-shards
      - name: Verify every selected test ran exactly once
        run: node scripts/test/verify-e2e-shards.mjs e2e-shards
      - name: Merge Playwright reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p all-blob-reports
          find e2e-shards -type d -name blob-report -exec sh -c 'cp -R "$1/." all-blob-reports/' _ {} \;
          npx playwright merge-reports --reporter=html all-blob-reports
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-summary
          path: |
            playwright-report/
            e2e-summary.json
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: hcm_km_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -phcm_km_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      KM_TEST_DB_HOST: 127.0.0.1
      KM_TEST_DB_PORT: 3307
      KM_TEST_DB_USER: root
      KM_TEST_DB_PASSWORD: hcm_km_root
      KM_TEST_DB_ADMIN_USER: root
      KM_TEST_DB_ADMIN_PASSWORD: hcm_km_root
      KM_TEST_ADMIN_DATABASE: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration
